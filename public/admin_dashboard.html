<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .active-status { color: #10B981; } /* emerald-500 */
        .inactive-status { color: #F87171; } /* red-400 */
    </style>
</head>
<body class="bg-gray-800 min-h-screen text-white">

    <header class="bg-gray-900 shadow-md p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-orange-400">🛠️ Admin Dashboard</h1>
        <div>
            <button onclick="window.location.href='user_generate.html'" class="bg-cyan-600 hover:bg-cyan-700 text-white px-3 py-1 rounded-lg text-sm mr-4">
                Generate Key (User Flow)
            </button>
            <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded-lg text-sm">
                Logout
            </button>
        </div>
    </header>

    <main class="container mx-auto p-6">
        <div id="loading" class="text-center text-lg mt-10">Memuat data...</div>

        <section class="mt-8">
            <h2 class="text-2xl font-semibold mb-4 border-b border-gray-600 pb-2 text-orange-300">👥 List Users</h2>
            <div id="userListContainer" class="overflow-x-auto bg-gray-700 rounded-lg shadow-lg">
                <table class="min-w-full divide-y divide-gray-600">
                    <thead class="bg-gray-600">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-200 uppercase tracking-wider">ID</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-200 uppercase tracking-wider">Nama Lengkap</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-200 uppercase tracking-wider">Email</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-200 uppercase tracking-wider">Status Akun</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-200 uppercase tracking-wider">Terdaftar Sejak</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody" class="divide-y divide-gray-600">
                        </tbody>
                </table>
            </div>
        </section>

        <section class="mt-12">
            <h2 class="text-2xl font-semibold mb-4 border-b border-gray-600 pb-2 text-orange-300">🔑 List API Keys</h2>
            <div id="apiKeyListContainer" class="overflow-x-auto bg-gray-700 rounded-lg shadow-lg">
                <table class="min-w-full divide-y divide-gray-600">
                    <thead class="bg-gray-600">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-200 uppercase tracking-wider">Key ID</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-200 uppercase tracking-wider">Key (Partial)</th> 
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-200 uppercase tracking-wider">Pemilik (Email)</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-200 uppercase tracking-wider">Kedaluwarsa</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-200 uppercase tracking-wider">Status Key</th>
                        </tr>
                    </thead>
                    <tbody id="apiKeyTableBody" class="divide-y divide-gray-600">
                        </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        const token = localStorage.getItem('adminToken');
        const userTableBody = document.getElementById('userTableBody');
        const apiKeyTableBody = document.getElementById('apiKeyTableBody');
        const loading = document.getElementById('loading');

        // Pengecekan Token saat memuat halaman
        if (!token) {
            alert("Anda harus login sebagai admin untuk mengakses dashboard.");
            window.location.href = 'admin_login.html';
        }

        // =========================================================================
        // Fungsi Logout
        // =========================================================================
        function logout() {
            localStorage.removeItem('adminToken');
            alert("Anda telah logout.");
            window.location.href = 'admin_login.html';
        }

        // =========================================================================
        // Fungsi Ambil Data User
        // =========================================================================
        async function fetchUsers() {
            try {
                const response = await fetch('/admin/users', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (response.status === 401 || response.status === 403) {
                    alert("Sesi Anda berakhir atau Token tidak valid. Silakan login kembali.");
                    return logout();
                }

                const result = await response.json();
                if (response.ok) {
                    renderUsers(result.data);
                } else {
                    userTableBody.innerHTML = `<tr><td colspan="5" class="px-6 py-4 text-center text-red-400">${result.error || 'Gagal memuat user.'}</td></tr>`;
                }

            } catch (error) {
                userTableBody.innerHTML = `<tr><td colspan="5" class="px-6 py-4 text-center text-red-400">Gagal terhubung ke server.</td></tr>`;
            }
        }

        function renderUsers(users) {
            userTableBody.innerHTML = users.map(user => `
                <tr class="hover:bg-gray-600">
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-100">${user.id}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-300">${user.first_name} ${user.last_name}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-300">${user.email}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-semibold ${user.status === 'active' ? 'text-green-400' : 'text-red-400'}">${user.status.toUpperCase()}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-300">${new Date(user.created_at).toLocaleDateString()}</td>
                </tr>
            `).join('');
        }
        
        // =========================================================================
        // Fungsi Ambil Data API Keys
        // =========================================================================
        async function fetchApiKeys() {
            try {
                const response = await fetch('/admin/apikeys', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (response.status === 401 || response.status === 403) {
                    return; 
                }

                const result = await response.json();
                if (response.ok) {
                    renderApiKeys(result.data);
                } else {
                    apiKeyTableBody.innerHTML = `<tr><td colspan="5" class="px-6 py-4 text-center text-red-400">${result.error || 'Gagal memuat API Keys.'}</td></tr>`;
                }

            } catch (error) {
                apiKeyTableBody.innerHTML = `<tr><td colspan="5" class="px-6 py-4 text-center text-red-400">Gagal terhubung ke server.</td></tr>`;
            } finally {
                loading.classList.add('hidden');
            }
        }

        function renderApiKeys(apiKeys) {
            apiKeyTableBody.innerHTML = apiKeys.map(key => {
                const keyStatusClass = key.status_realtime === 'active' ? 'active-status' : 'inactive-status';
                // Menampilkan Key Partial (disesuaikan karena prefix dihapus)
                const keyPartial = `***-${key.api_key.substring(key.api_key.length - 15)}`;
                
                return `
                    <tr class="hover:bg-gray-600">
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-100">${key.key_id}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-mono text-cyan-400">${keyPartial}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-300">${key.user_email}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-300">${key.expiry_date}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-bold ${keyStatusClass}">${key.status_realtime.toUpperCase()}</td>
                    </tr>
                `;
            }).join('');
        }

        // Panggil fungsi untuk memuat data saat halaman dimuat
        document.addEventListener('DOMContentLoaded', () => {
            if (token) {
                fetchUsers();
                fetchApiKeys();
            }
        });

    </script>
</body>
</html>
