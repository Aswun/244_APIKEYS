<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#4d5b6f] min-h-screen flex items-center justify-center">

    <div class="bg-white/10 backdrop-blur-sm rounded-2xl shadow-xl w-full max-w-sm p-8 text-white">
        <h1 class="text-2xl font-bold mb-4 text-center text-[#e5c3bd]">Registrasi Admin</h1>
        <p class="text-sm text-[#a3c1cd] mb-6 text-center">Buat akun administrator untuk mengakses dashboard.</p>

        <form id="adminRegisterForm" class="space-y-4" onsubmit="return false;">
            <div>
                <label for="email" class="block text-sm font-medium mb-1 text-[#a3c1cd]">Email</label>
                <input type="email" id="email" name="email" placeholder="admin@example.com" required
                    class="w-full px-4 py-2 rounded-lg bg-white/20 border border-white/30 placeholder-[#a3c1cd] text-white focus:outline-none focus:ring-2 focus:ring-[#e5c3bd]">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium mb-1 text-[#a3c1cd]">Password</label>
                <input type="password" id="password" name="password" placeholder="Min. 6 Karakter" required
                    class="w-full px-4 py-2 rounded-lg bg-white/20 border border-white/30 placeholder-[#a3c1cd] text-white focus:outline-none focus:ring-2 focus:ring-[#e5c3bd]">
            </div>

            <div>
                <label for="confirmPassword" class="block text-sm font-medium mb-1 text-[#a3c1cd]">Konfirmasi Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Ulangi Password" required
                    class="w-full px-4 py-2 rounded-lg bg-white/20 border border-white/30 placeholder-[#a3c1cd] text-white focus:outline-none focus:ring-2 focus:ring-[#e5c3bd]">
            </div>

            <button type="button" onclick="registerAdmin()"
                class="w-full bg-[#e5c3bd] text-[#4d5b6f] hover:bg-[#a3c1cd] transition-colors duration-200 py-2 rounded-lg font-semibold shadow-md">
                Register
            </button>
        </form>

        <div id="message" class="mt-4 text-center text-sm hidden"></div>

        <p class="text-center text-xs text-white mt-6">
            Sudah punya akun? <a href="admin_login.html" class="text-[#a3c1cd] hover:text-[#e5c3bd] underline">Login Admin</a>
        </p>
    </div>

    <script>
        const messageBox = document.getElementById("message");

        function showMessage(text, isError = false) {
            messageBox.textContent = text;
            messageBox.classList.remove('hidden', 'text-white', 'text-red-400');
            messageBox.classList.add(isError ? 'text-red-400' : 'text-white');
        }

        async function registerAdmin() {
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (!email || !password || !confirmPassword) {
                return showMessage("Semua field wajib diisi.", true);
            }
            if (password !== confirmPassword) {
                return showMessage("Password dan Konfirmasi Password tidak cocok.", true);
            }
            if (password.length < 6) {
                return showMessage("Password minimal 6 karakter.", true);
            }

            try {
                const response = await fetch("/admin/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage(data.message + " Mengarahkan ke halaman login...", false);
                    setTimeout(() => {
                        window.location.href = 'admin_login.html';
                    }, 1500);
                } else {
                    showMessage(data.error || "Gagal registrasi admin.", true);
                }
            } catch (err) {
                showMessage("Gagal menghubungi server.", true);
            }
        }
    </script>

</body>
</html>
